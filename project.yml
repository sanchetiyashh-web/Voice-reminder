name: VoicePlanner
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VoicePlanner:
    type: application
    platform: iOS
    sources:
      - path: VoicePlanner
      - path: engine/understanding.js
        buildPhase: resources
    info:
      path: VoicePlanner/Info.plist
      properties:
        CFBundleDisplayName: Voice Planner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: "Voice Planner listens only while you are recording an idea, task or appointment."
        NSSpeechRecognitionUsageDescription: "Your speech is turned into text on your iPhone so Voice Planner can save ideas, tasks and appointments. Apple's servers are used only if you allow it in Settings."
        NSCalendarsFullAccessUsageDescription: "Voice Planner adds your appointments to Calendar and updates them when you reschedule."
        NSCalendarsUsageDescription: "Voice Planner adds your appointments to Calendar and updates them when you reschedule."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.voiceplanner
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_PREVIEWS: NO
    scheme: {}
