name: build

on:
  push:
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Understanding engine tests
        run: node engine/tests/run-node.js

  ios:
    needs: engine-tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build (unsigned, for device)
        run: |
          set -o pipefail
          xcodebuild -project VoicePlanner.xcodeproj -scheme VoicePlanner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VoicePlanner.app Payload/
          test -f Payload/VoicePlanner.app/understanding.js
          zip -qry VoicePlanner-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VoicePlanner-unsigned-ipa
          path: VoicePlanner-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
