name: build

on:
  push:
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Understanding engine tests
        run: node engine/tests/run-node.js

  ios:
    needs: engine-tests
    # Apple-silicon macOS runners (macos-15 / macos-latest) are capacity-constrained and the
    # first run was never picked up; the Intel image builds iOS apps the same way.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build (unsigned, for device)
        run: |
          set -o pipefail
          xcodebuild -project VoicePlanner.xcodeproj -scheme VoicePlanner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log
      - name: Publish build errors as annotations
        if: failure()
        run: |
          # Logs need a GitHub sign-in to view; annotations and the job summary are public.
          grep -E "error:|fatal error|failed|Failed to|could not|Could not" build.log | grep -v "^note:" | sort -u | head -40 > errors.txt || true
          [ -s errors.txt ] || tail -40 build.log > errors.txt
          while IFS= read -r line; do
            if [[ "$line" =~ ^(/[^:]+\.swift):([0-9]+):([0-9]+):\ error:\ (.*)$ ]]; then
              f="${BASH_REMATCH[1]#$GITHUB_WORKSPACE/}"
              echo "::error file=$f,line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[4]}"
            else
              echo "::error::${line:0:900}"
            fi
          done < errors.txt
          { echo '## Build errors'; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VoicePlanner.app Payload/
          test -f Payload/VoicePlanner.app/understanding.js
          zip -qry VoicePlanner-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VoicePlanner-unsigned-ipa
          path: VoicePlanner-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
